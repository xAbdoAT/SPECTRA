<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a3042" />
      <stop offset="50%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="emerald" x1="20" y1="26" x2="48" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Obsidian squircle keycap -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg)" stroke="url(#border)" stroke-width="2.5" />

  <!-- Subtle inner keycap rim -->
  <rect x="8" y="8" width="84" height="84" rx="18" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Left: Terminal prompt prism chevron (›) -->
  <path d="M24 29L46 50L24 71" stroke="url(#emerald)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right: Parallel multi-model racing spectrum bars + terminal underscore (_) -->
  <!-- Tier 1: High-velocity stream -->
  <rect x="56" y="27" width="22" height="8" rx="4" fill="#10b981" fill-opacity="0.55" />
  <!-- Tier 2: Mid-spectrum race -->
  <rect x="60" y="45" width="18" height="8" rx="4" fill="#10b981" fill-opacity="0.85" />
  <!-- Tier 3: Active terminal underscore / winning completion -->
  <rect x="50" y="63" width="28" height="9" rx="4.5" fill="#f4f4f6" />
</svg>
